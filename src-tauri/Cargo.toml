[package]
name = "lora"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
active-win-pos-rs = "0.11.0"
chrono = "0.4.45"
serde_json = "1.0.151"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-opener = "2"
user-idle = "0.6.0"
# Même version que tauri (une seule copie compilée) : volume système (Core Audio) et lecteur de musique (commandes multimédia).
base64 = "0.22" # jeton de l'API Spotify (en-tête Basic)
ureq = { version = "3", features = ["json"] } # recherche d'un morceau sur l'API web de Spotify
cpal = "0.18" # micro (WASAPI) pour l'écoute du mot d'activation
hidapi = "2" # batterie de la souris : protocole HID++ de Logitech (récepteur LIGHTSPEED)
windows = { version = "0.62", features = ["Foundation", "Media_Control", "Media_Core", "Media_Playback", "Media_SpeechSynthesis", "Storage_Streams", "Win32_Devices_FunctionDiscovery", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Diagnostics_Debug", "Win32_System_Threading","Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Exécutable plus petit (la vitesse du Rust n'est pas le goulot : un thread qui dort 5 s). panic reste en "unwind" :
# avec "abort", une panique du thread de suivi arrêterait toute l'app.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
